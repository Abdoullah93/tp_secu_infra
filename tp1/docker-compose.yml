services:
  # Service de visualisation (ISOLÉ)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # Pas de section "ports" ici -> inaccessible depuis l'extérieur
    networks:
      - monitoring_net
    restart: unless-stopped

  # Service de métriques (ISOLÉ)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Pas de section "ports" ici -> inaccessible depuis l'extérieur
    networks:
      - monitoring_net
    restart: unless-stopped

  # Le Reverse Proxy (EXPOSÉ)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80" # Seul le port 80 est ouvert sur l'hôte
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - monitoring_net
    depends_on:
      - grafana
      - prometheus
    restart: always

# Création du réseau interne commun
networks:
  monitoring_net:
    driver: bridge